<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Puzzle – with Image</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: #16213e;
            padding: 30px 30px 35px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 720px;
            width: 100%;
        }

        h1 {
            color: #e0e0e0;
            font-weight: 400;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 18px;
            border-bottom: 1px solid #2a3a5e;
            padding-bottom: 12px;
            width: 100%;
            text-align: center;
        }
        h1 span {
            font-weight: 600;
            color: #7ec8e3;
        }

        /* ── Grid with background image ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;               /* small gap so image grid lines show? adjust if needed */
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 600px;
            margin: 0 auto 20px;
            /* background image */
            background-image: url('bcodeface.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 12px;
            overflow: hidden;        /* keeps corners tidy */
        }

        /* ── Tile – transparent overlay ── */
        .tile {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            background: rgba(0, 0, 0, 0.15);   /* slight darkening so numbers pop */
            backdrop-filter: blur(0px);        /* remove if you want crystal clear */
            border-radius: 6px;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        /* Hover effect – subtle highlight */
        .tile:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.97);
        }

        /* State 0 vs 1 – only text colour changes, background stays transparent */
        .tile.state-0 .number {
            color: #f0f0f0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }
        .tile.state-1 .number {
            color: #ffd93d;
            text-shadow: 0 0 20px rgba(255, 217, 61, 0.7), 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .tile .number {
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            transition: transform 0.1s ease, color 0.15s;
            font-size: 2.4rem;      /* fallback, will be scaled by JS */
        }

        /* ── Controls ── */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px 30px;
            width: 100%;
            margin-top: 6px;
            padding-top: 16px;
            border-top: 1px solid #2a3a5e;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group label {
            color: #b0c4de;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .control-group input[type="range"] {
            width: 160px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #2a3a5e;
            border-radius: 10px;
            outline: none;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #7ec8e3;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(126, 200, 227, 0.4);
        }
        .control-group input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #7ec8e3;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .scale-value {
            color: #e0e0e0;
            font-weight: 600;
            font-size: 1.1rem;
            min-width: 40px;
            text-align: center;
            background: #0f1f33;
            padding: 2px 10px;
            border-radius: 20px;
        }

        .btn-reset {
            background: #e94560;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 0 #a12a3f;
        }
        .btn-reset:hover {
            background: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #a12a3f;
        }
        .btn-reset:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a12a3f;
        }

        /* optional toggle for image background */
        .image-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b0c4de;
            font-size: 0.9rem;
        }
        .image-toggle input {
            width: 18px;
            height: 18px;
            accent-color: #7ec8e3;
            cursor: pointer;
        }

        @media (max-width: 550px) {
            .container { padding: 20px 16px 25px; }
            .grid { gap: 3px; }
            .controls { flex-direction: column; align-items: stretch; gap: 16px; }
            .control-group { justify-content: space-between; }
            .control-group input[type="range"] { width: 120px; flex: 1; min-width: 80px; }
            .btn-reset { width: 100%; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 <span>6×6</span> Binary Puzzle</h1>

        <div class="grid" id="grid"></div>

        <div class="controls">
            <div class="control-group">
                <label for="scaleSlider">Scale</label>
                <input type="range" id="scaleSlider" min="0.20" max="1.80" step="0.01" value="1.00" />
                <span class="scale-value" id="scaleDisplay">1.00</span>
            </div>
            <button class="btn-reset" id="resetBtn">⟳ Reset All</button>
            <div class="image-toggle">
                <input type="checkbox" id="bgToggle" checked />
                <label for="bgToggle">Show image</label>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const gridEl = document.getElementById('grid');
            const scaleSlider = document.getElementById('scaleSlider');
            const scaleDisplay = document.getElementById('scaleDisplay');
            const resetBtn = document.getElementById('resetBtn');
            const bgToggle = document.getElementById('bgToggle');

            const ROWS = 6, COLS = 6, TOTAL = ROWS * COLS;
            const state = new Array(TOTAL).fill(0);

            // ─── Render ──────────────────────────────────────────
            function render() {
                gridEl.innerHTML = '';
                for (let i = 0; i < TOTAL; i++) {
                    const tile = document.createElement('div');
                    tile.className = `tile state-${state[i]}`;
                    tile.dataset.index = i;

                    const numberSpan = document.createElement('span');
                    numberSpan.className = 'number';
                    numberSpan.textContent = state[i];
                    tile._numberEl = numberSpan;
                    tile.appendChild(numberSpan);
                    gridEl.appendChild(tile);

                    tile.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        state[idx] = state[idx] === 0 ? 1 : 0;
                        this.className = `tile state-${state[idx]}`;
                        this._numberEl.textContent = state[idx];
                        applyScaleToTile(this);
                    });
                }
                applyScaleToAll();
            }

            // ─── Scale ────────────────────────────────────────────
            function getScale() { return parseFloat(scaleSlider.value); }

            function applyScaleToTile(tile) {
                const numEl = tile._numberEl;
                if (numEl) numEl.style.transform = `scale(${getScale()})`;
            }

            function applyScaleToAll() {
                const tiles = gridEl.querySelectorAll('.tile');
                const scale = getScale();
                tiles.forEach(t => {
                    const num = t._numberEl;
                    if (num) num.style.transform = `scale(${scale})`;
                });
                scaleDisplay.textContent = scale.toFixed(2);
            }

            // ─── Reset ────────────────────────────────────────────
            function resetAll() {
                for (let i = 0; i < TOTAL; i++) state[i] = 0;
                const tiles = gridEl.querySelectorAll('.tile');
                tiles.forEach((t, i) => {
                    t.className = 'tile state-0';
                    const num = t._numberEl;
                    if (num) num.textContent = '0';
                    applyScaleToTile(t);
                });
            }

            // ─── Background toggle ──────────────────────────────
            function toggleBackground(show) {
                gridEl.style.backgroundImage = show ? "url('bcodeface.png')" : 'none';
                gridEl.style.backgroundColor = show ? 'transparent' : '#1a2f4f';
            }

            // ─── Init ─────────────────────────────────────────────
            function init() {
                render();

                scaleSlider.addEventListener('input', function() {
                    scaleDisplay.textContent = parseFloat(this.value).toFixed(2);
                    applyScaleToAll();
                });

                resetBtn.addEventListener('click', resetAll);

                bgToggle.addEventListener('change', function() {
                    toggleBackground(this.checked);
                });
                // start with image on
                toggleBackground(true);

                // keyboard 'r' reset
                document.addEventListener('keydown', (e) => {
                    if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) {
                        resetAll();
                        e.preventDefault();
                    }
                });
            }

            init();
        })();
    </script>
</body>
</html>
