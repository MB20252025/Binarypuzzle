<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6×6 Binary Puzzle – with second image</title>
    <style>
        /* ── Full‑screen background ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* The image fills the entire viewport without cropping */
            background-image: url('bcodeface.png');
            background-size: contain;    /* ← "zoom out" – shows the whole image */
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a2e;   /* fallback colour */
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        /* ── Overlay container ── */
        #overlay {
            position: relative;
            width: 100vw;
            height: 100vh;
            pointer-events: none;        /* allow clicks to pass to numbers */
        }

        /* ── Second image (solutionbox.png) as <img> ── */
        #solution-image {
            position: absolute;
            pointer-events: none;        /* don't block clicks */
            z-index: 0;                  /* behind numbers */
            object-fit: contain;         /* keeps aspect ratio */
        }

        /* ── Numbers ── */
        .number-item {
            position: absolute;
            pointer-events: auto;        /* clickable */
            z-index: 1;                  /* on top of the solution image */
            font-weight: 700;
            text-align: center;
            transform: translate(-50%, -50%);
            line-height: 1;
            transition: color 0.15s;
            background: transparent;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(0, 0, 0, 0.95), 0 2px 10px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            width: 80px;
            height: 80px;
        }

        .number-item.state-1 {
            color: #ffd93d;
            text-shadow: 0 0 40px rgba(255, 217, 61, 0.5), 0 0 20px rgba(0, 0, 0, 0.9);
        }

        @media (max-width: 600px) {
            .number-item {
                width: 60px;
                height: 60px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <!-- Second image as an <img> tag for reliable sizing -->
        <img id="solution-image" src="solutionbox.png" alt="solution box" />
        <!-- Numbers will be injected here by JS -->
    </div>

    <script>
        // ================================================================
        //  CONFIGURATION – EDIT THESE VALUES TO CUSTOMIZE THE PUZZLE
        // ================================================================

        // 1. Overall scale of ALL numbers (change this to resize them)
        const SCALE = 1.0;   // e.g., 0.8 = smaller, 1.5 = larger

        // 2. Positions for each of the 36 numbers (6 columns × 6 rows).
        //    x = % from the left edge of the screen
        //    y = % from the top edge of the screen
        const POSITIONS = [
            // Row 1
            { x: 18, y: 25 },  // Tile  0
            { x: 31, y: 25 },  // Tile  1
            { x: 44, y: 25 },  // Tile  2
            { x: 57, y: 25 },  // Tile  3
            { x: 70, y: 25 },  // Tile  4
            { x: 83, y: 25 },  // Tile  5
            // Row 2
            { x: 18, y: 32 },  // Tile  6
            { x: 31, y: 32 },  // Tile  7
            { x: 44, y: 32 },  // Tile  8
            { x: 57, y: 32 },  // Tile  9
            { x: 70, y: 32 },  // Tile 10
            { x: 83, y: 32 },  // Tile 11
            // Row 3
            { x: 18, y: 38.5 },  // Tile 12
            { x: 31, y: 38.5 },  // Tile 13
            { x: 44, y: 38.5 },  // Tile 14
            { x: 57, y: 38.5 },  // Tile 15
            { x: 70, y: 38.5 },  // Tile 16
            { x: 83, y: 38.5 },  // Tile 17
            // Row 4
            { x: 18, y: 45.5 },  // Tile 18
            { x: 31, y: 45.5 },  // Tile 19
            { x: 44, y: 45.5 },  // Tile 20
            { x: 57, y: 45.5 },  // Tile 21
            { x: 70, y: 45.5 },  // Tile 22
            { x: 83, y: 45.5 },  // Tile 23
            // Row 5
            { x: 18, y: 52 },  // Tile 24
            { x: 31, y: 52 },  // Tile 25
            { x: 44, y: 52 },  // Tile 26
            { x: 57, y: 52 },  // Tile 27
            { x: 70, y: 52 },  // Tile 28
            { x: 83, y: 52 },  // Tile 29
            // Row 6
            { x: 18, y: 58.5 },  // Tile 30
            { x: 31, y: 58.5 },  // Tile 31
            { x: 44, y: 58.5 },  // Tile 32
            { x: 57, y: 58.5 },  // Tile 33
            { x: 70, y: 58.5 },  // Tile 34
            { x: 83, y: 58.5 }   // Tile 35
        ];

        // 3. SECOND IMAGE (solutionbox.png)
        //    x, y = % from left/top edge
        //    width, height = % of viewport size (use 'auto' to keep aspect ratio)
        const SOLUTION_IMAGE = {
            url: 'solutionbox.png',
            x: 10,              // % from left
            y: 70,              // % from top (so it sits below the puzzle)
            width: 25,          // % of viewport width
            height: 'auto'      // keeps aspect ratio
        };

        // ================================================================
        //  END OF CONFIGURATION – DO NOT EDIT BELOW THIS LINE
        // ================================================================

        const overlay = document.getElementById('overlay');
        const solutionImg = document.getElementById('solution-image');
        const total = POSITIONS.length;
        const state = new Array(total).fill(0);

        // ─── Render second image ─────────────────────────────────────────
        function renderSolutionImage() {
            const img = SOLUTION_IMAGE;
            // Position
            solutionImg.style.left = img.x + '%';
            solutionImg.style.top = img.y + '%';
            // Size
            solutionImg.style.width = (img.width !== 'auto' ? img.width + '%' : 'auto');
            solutionImg.style.height = (img.height !== 'auto' ? img.height + '%' : 'auto');
        }

        // ─── Render numbers ──────────────────────────────────────────────
        function renderNumbers() {
            const baseSize = 48;
            const scaledSize = baseSize * SCALE;

            POSITIONS.forEach((pos, index) => {
                const el = document.createElement('div');
                el.className = `number-item state-${state[index]}`;
                el.textContent = state[index];

                el.style.fontSize = scaledSize + 'px';
                el.style.width = (scaledSize * 1.6) + 'px';
                el.style.height = (scaledSize * 1.6) + 'px';
                el.style.left = pos.x + '%';
                el.style.top = pos.y + '%';

                el.addEventListener('click', function(e) {
                    state[index] = state[index] === 0 ? 1 : 0;
                    this.textContent = state[index];
                    this.className = `number-item state-${state[index]}`;
                });

                overlay.appendChild(el);
            });
        }

        // ─── Init ─────────────────────────────────────────────────────────
        renderSolutionImage();
        renderNumbers();
    </script>
</body>
</html>
