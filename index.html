<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6×6 Binary Puzzle – Screw Mechanics + Old Puzzle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            overflow-y: auto;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            background-image: url('bcodeface.png');
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-position: top left;
            background-color: #1a1a2e;
        }

        #overlay {
            position: relative;
            width: 100%;
            min-height: inherit;
            pointer-events: none;
        }

        .extra-image {
            position: absolute;
            object-fit: contain;
            pointer-events: none;
        }

        /* ── Layer z‑indexes ── */
        .layer-other    { z-index: 1; }
        .layer-solution { z-index: 2; }
        .layer-above    { z-index: 3; }
        .cover          { z-index: 4; transition: top 0.8s ease, opacity 0.8s; }
        .cover.dropped  { top: 110% !important; opacity: 0; }
        .screw          { z-index: 5; pointer-events: auto; cursor: pointer; transition: transform 0.3s ease, opacity 0.5s, top 0.5s; }
        .screw.dropped  { pointer-events: none; opacity: 0; top: 110% !important; }

        /* ── Numbers (grid) – now using old puzzle styling ── */
        .number-item {
            position: absolute;
            pointer-events: auto;
            z-index: 10;
            font-weight: 700;
            text-align: center;
            transform: translate(-50%, -50%);
            line-height: 1;
            transition: color 0.15s;
            background: transparent;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(0, 0, 0, 0.95), 0 2px 10px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            width: 80px;
            height: 80px;
        }
        .number-item.state-1 {
            color: #ffd93d;
            text-shadow: 0 0 40px rgba(255, 217, 61, 0.5), 0 0 20px rgba(0, 0, 0, 0.9);
        }

        /* ── Old puzzle grid styles ── */
        .puzzle-container {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 8;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            gap: 5px;
            background: #0d1a24;
            padding: 12px;
            border-radius: 16px;
            box-shadow: inset 0 0 10px #010101, 0 6px 0 #0f171f;
        }
        .tile {
            width: 50px;
            height: 50px;
            background: #1e2c3a;
            border-radius: 12px;
            box-shadow: inset 0 -3px 0 #0f181f, 0 2px 5px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            color: #c8e0f0;
            cursor: pointer;
            transition: all 0.08s;
            border: 1px solid #3a5065;
            text-shadow: 0 2px 3px black;
            font-family: 'Courier New', monospace;
        }
        .tile.locked {
            background: #263845;
            color: #6b869f;
            border-color: #475f74;
            box-shadow: inset 0 -2px 0 #17232b, 0 1px 3px rgba(0,0,0,0.7);
            cursor: not-allowed;
            filter: brightness(0.85);
        }
        .tile:active:not(.locked) {
            background: #2f4153;
            transform: scale(0.94);
            box-shadow: inset 0 0 10px #0a1118;
        }
        .action-button {
            background: #2a3948;
            border: none;
            color: #e5efff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #10171f, 0 3px 12px black;
            transition: 0.07s linear;
            border: 1px solid #4d6479;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: auto;
        }
        .action-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #10171f;
        }
        .action-button:disabled {
            opacity: 0.6;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #10171f;
            cursor: not-allowed;
        }
        .message-area {
            min-height: 40px;
            font-size: 1.4rem;
            font-weight: 500;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .granted { color: #87f5b2; text-shadow: 0 0 10px #00cc66; animation: unlockPulse 0.8s; }
        .denied { color: #ff8a8a; text-shadow: 0 0 10px #cc3333; }
        .analyzing-text { color: #f5e56b; text-shadow: 0 0 6px #ffd966; }
        @keyframes unlockPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); text-shadow: 0 0 25px #33ee88; }
        }
        .led-strip {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 6px;
        }
        .led {
            width: 10px;
            height: 10px;
            background: #2b3a44;
            border-radius: 50%;
            box-shadow: inset 0 0 4px black;
        }
        .led.active { background: #44dd88; box-shadow: 0 0 12px #22ee88; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(6, 38px); gap: 4px; padding: 8px; }
            .tile { width: 38px; height: 38px; font-size: 20px; }
            .puzzle-container { top: 30%; padding: 12px; }
            .action-button { font-size: 0.9rem; padding: 8px 16px; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <!-- The binary puzzle grid will be injected here -->
    </div>

    <script>
        // ================================================================
        //  OLD PUZZLE LOGIC – copied and adapted
        // ================================================================

        const SIZE = 6;
        const EMPTY = -1;
        const CIRCLE = 0;
        const TRIANGLE = 1;

        // ─── Clue & Solution patterns from old game ─────────────────────
        const cluePattern = [
            "0.....",
            "......",
            "1.....",
            ".0..0.",
            "1..0..",
            ".0...0"
        ];
        const solutionPattern = [
            "001011",
            "010011",
            "110100",
            "001101",
            "110010",
            "101100"
        ];

        function patternToGrid(pattern) {
            const grid = Array(SIZE).fill().map(() => Array(SIZE).fill(EMPTY));
            for (let r = 0; r < SIZE; r++) {
                const rowStr = pattern[r];
                for (let c = 0; c < SIZE; c++) {
                    const ch = rowStr[c];
                    if (ch === '0') grid[r][c] = CIRCLE;
                    else if (ch === '1') grid[r][c] = TRIANGLE;
                }
            }
            return grid;
        }

        const clueGrid = patternToGrid(cluePattern);
        const solutionGrid = patternToGrid(solutionPattern);
        const lockedGrid = Array(SIZE).fill().map((_, r) =>
            Array(SIZE).fill().map((_, c) => clueGrid[r][c] !== EMPTY)
        );

        let currentGrid = clueGrid.map(row => [...row]);
        let puzzleSolved = false;

        // ─── DOM refs for puzzle ─────────────────────────────────────────
        const overlay = document.getElementById('overlay');

        // We'll create a container for the puzzle elements
        const puzzleContainer = document.createElement('div');
        puzzleContainer.className = 'puzzle-container';
        overlay.appendChild(puzzleContainer);

        const gridContainer = document.createElement('div');
        gridContainer.className = 'grid';
        puzzleContainer.appendChild(gridContainer);

        const messageDiv = document.createElement('div');
        messageDiv.className = 'message-area';
        puzzleContainer.appendChild(messageDiv);

        const checkBtn = document.createElement('button');
        checkBtn.className = 'action-button';
        checkBtn.textContent = '🔒 VERIFY';
        puzzleContainer.appendChild(checkBtn);

        const ledStrip = document.createElement('div');
        ledStrip.className = 'led-strip';
        for (let i = 0; i < 4; i++) {
            const led = document.createElement('span');
            led.className = 'led';
            ledStrip.appendChild(led);
        }
        puzzleContainer.appendChild(ledStrip);

        // ─── Render grid ──────────────────────────────────────────────────
        function renderGrid(applyFade = false) {
            gridContainer.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    if (lockedGrid[r][c]) tile.classList.add('locked');
                    tile.dataset.row = r;
                    tile.dataset.col = c;
                    const val = currentGrid[r][c];
                    tile.textContent = val === CIRCLE ? '0' : (val === TRIANGLE ? '1' : '');
                    gridContainer.appendChild(tile);
                }
            }
        }

        // ─── Tile click handler ──────────────────────────────────────────
        function cycleValue(currentVal) {
            if (currentVal === EMPTY) return CIRCLE;
            if (currentVal === CIRCLE) return TRIANGLE;
            return EMPTY;
        }

        gridContainer.addEventListener('click', (e) => {
            const tile = e.target.closest('.tile');
            if (!tile) return;
            if (tile.classList.contains('locked')) return;
            if (checkBtn.disabled) return;
            const row = parseInt(tile.dataset.row);
            const col = parseInt(tile.dataset.col);
            const newVal = cycleValue(currentGrid[row][col]);
            currentGrid[row][col] = newVal;
            tile.textContent = newVal === CIRCLE ? '0' : (newVal === TRIANGLE ? '1' : '');
            // If solved, we could auto-check? We'll let user press verify.
        });

        // ─── Check solution ──────────────────────────────────────────────
        function checkSolution() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (currentGrid[r][c] !== solutionGrid[r][c]) return false;
                }
            }
            return true;
        }

        // ─── Verify button ──────────────────────────────────────────────
        checkBtn.addEventListener('click', () => {
            if (checkBtn.disabled) return;
            checkBtn.disabled = true;
            messageDiv.innerHTML = '<span class="analyzing-text">🔍 ANALYZING…</span>';
            // Simulate scan
            setTimeout(() => {
                const correct = checkSolution();
                if (correct) {
                    puzzleSolved = true;
                    messageDiv.innerHTML = '<span class="granted">🔓 ACCESS GRANTED</span>';
                    document.querySelectorAll('.led').forEach((led, i) => setTimeout(() => led.classList.add('active'), i * 100));
                    // Unlock the vault (global flag)
                    if (window.unlockVault) window.unlockVault();
                } else {
                    messageDiv.innerHTML = '<span class="denied">⛔ ACCESS DENIED</span>';
                }
                checkBtn.disabled = false;
            }, 800);
        });

        // ─── Auto‑solve (called from green.png click) ──────────────────
        function autoSolvePuzzle() {
            if (puzzleSolved) return;
            // Fill currentGrid with solution
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    currentGrid[r][c] = solutionGrid[r][c];
                }
            }
            renderGrid();
            // Trigger verify
            checkBtn.click();
        }

        // ─── Expose autoSolve to global scope ───────────────────────────
        window.autoSolvePuzzle = autoSolvePuzzle;

        // ─── Render initial grid ─────────────────────────────────────────
        renderGrid();

        // ─── Screws & hole mechanics (from earlier version) ─────────────
        // We'll keep the existing screw/hole logic, but we need to adapt the coordinates
        // and the interaction with the new images.

        // Since we have the old puzzle grid, we need to remove the previous number items.
        // The previous version used absolute positioned numbers; we'll keep them but we can hide them if needed.
        // But the puzzle grid now replaces them. We'll keep both? The old numbers are on top of everything
        // (z-index 10) and might overlap. We can hide or remove them. Let's remove the old number generation.
        // We'll comment out or remove the old renderNumbers call from the previous script.
        // But since we are building a new file, we'll just not include the old number logic.

        // We'll re‑implement the screws and hole using the coordinates from the user's last version.

        // ─── Layers and images ──────────────────────────────────────────

        // The user's configuration from the last version:
        const LAYERS = [
            { src: 'greencut.png',    x: 40, y: 85, width: 25, height: 'auto', cls: 'layer-other' },
            { src: 'redbluecut.png',  x: 40, y: 85, width: 25, height: 'auto', cls: 'layer-other' },
            { src: 'solutionbox.png', x: 40, y: 85, width: 25, height: 'auto', cls: 'layer-solution' },
            // These two will be clickable after screws drop
            { src: 'bluegreen.png',   x: 42.3, y: 87, width: 20.3, height: 'auto', cls: 'layer-above' },
            { src: 'green.png',       x: 42, y: 91.5, width: 20.9, height: 'auto', cls: 'layer-above' },
        ];

        const COVER = { src: 'hole.png', x: 1, y: 85, width: 25, height: 'auto', cls: 'cover' };
        const SCREWS = [
            { src: 'screw1.png', x: 1, y: 86, width: 7.3, height: 'auto' },
            { src: 'screw2.png', x: 1, y: 86, width: 7.3, height: 'auto' },
            { src: 'screw3.png', x: 1, y: 91, width: 7.3, height: 'auto' },
            { src: 'screw4.png', x: 1, y: 91, width: 7.3, height: 'auto' },
        ];

        // ─── Render images ──────────────────────────────────────────────
        function renderImages() {
            LAYERS.forEach((data) => {
                const img = document.createElement('img');
                img.src = data.src;
                img.className = `extra-image ${data.cls || ''}`;
                img.style.left = data.x + '%';
                img.style.top = data.y + '%';
                img.style.width = (data.width !== 'auto' ? data.width + '%' : 'auto');
                img.style.height = (data.height !== 'auto' ? data.height + '%' : 'auto');
                overlay.appendChild(img);
                // Store references for click handling
                if (data.src === 'green.png') {
                    img.id = 'green-img';
                    img.style.pointerEvents = 'auto';
                    img.style.cursor = 'pointer';
                    img.addEventListener('click', function(e) {
                        e.stopPropagation();
                        // Auto-solve the puzzle when green.png is clicked
                        if (window.autoSolvePuzzle) window.autoSolvePuzzle();
                    });
                }
                if (data.src === 'bluegreen.png') {
                    img.id = 'bluegreen-img';
                    // bluegreen could also trigger something else? For now, just reveal redbluecut.
                    // But we'll keep it simple: we already have redbluecut as layer-other.
                }
            });

            // Cover
            const coverImg = document.createElement('img');
            coverImg.src = COVER.src;
            coverImg.className = `extra-image ${COVER.cls || ''}`;
            coverImg.style.left = COVER.x + '%';
            coverImg.style.top = COVER.y + '%';
            coverImg.style.width = (COVER.width !== 'auto' ? COVER.width + '%' : 'auto');
            coverImg.style.height = (COVER.height !== 'auto' ? COVER.height + '%' : 'auto');
            coverImg.id = 'cover-image';
            overlay.appendChild(coverImg);

            // Screws
            const screwElements = [];
            SCREWS.forEach((data, index) => {
                const img = document.createElement('img');
                img.src = data.src;
                img.className = 'extra-image screw';
                img.style.left = data.x + '%';
                img.style.top = data.y + '%';
                img.style.width = (data.width !== 'auto' ? data.width + '%' : 'auto');
                img.style.height = (data.height !== 'auto' ? data.height + '%' : 'auto');
                img.dataset.index = index;
                img.addEventListener('click', function(e) {
                    e.stopPropagation();
                    handleScrewClick(index);
                });
                overlay.appendChild(img);
                screwElements.push(img);
            });

            // Store references for later
            window.screwElements = screwElements;
            window.coverElement = coverImg;
            window.screwClicks = [0, 0, 0, 0];
        }

        // ─── Screw click logic ──────────────────────────────────────────
        function handleScrewClick(index) {
            const clicks = window.screwClicks;
            if (clicks[index] >= 4) return;
            clicks[index]++;
            const element = window.screwElements[index];
            const rotation = clicks[index] * 90;
            element.style.transform = `rotate(${rotation}deg)`;
            if (clicks[index] >= 4) {
                element.classList.add('dropped');
                checkAllScrewsDropped();
            }
        }

        function checkAllScrewsDropped() {
            const allDropped = window.screwClicks.every(c => c >= 4);
            if (allDropped && window.coverElement) {
                window.coverElement.classList.add('dropped');
                // Now the bluegreen and green images are visible and clickable.
                // The green image already has a click handler to autoSolvePuzzle.
                // The bluegreen could be used to reveal redbluecut, but we already have that as layer-other.
                // We'll make bluegreen clickable to show redbluecut (just for fun).
                const bluegreen = document.getElementById('bluegreen-img');
                if (bluegreen) {
                    bluegreen.style.pointerEvents = 'auto';
                    bluegreen.style.cursor = 'pointer';
                    bluegreen.addEventListener('click', function() {
                        const redbluecut = document.querySelector('img[src="redbluecut.png"]');
                        if (redbluecut) redbluecut.style.zIndex = 11;
                    });
                }
            }
        }

        // ─── Set body height ─────────────────────────────────────────────
        function setBodyHeight() {
            const img = new Image();
            img.onload = function() {
                const aspect = img.width / img.height;
                const heightPx = window.innerWidth / aspect;
                document.body.style.minHeight = heightPx + 'px';
                overlay.style.minHeight = heightPx + 'px';
            };
            img.src = 'bcodeface.png';
        }

        // ─── Vault unlock (to be called from puzzle solve) ─────────────
        function unlockVault() {
            // This function will be called when puzzle is solved (either manually or via auto-solve)
            // In the old game, it would trigger the door unlock. We'll just log and maybe show a message.
            console.log('VAULT UNLOCKED!');
            // Optionally, we can change the vault door state if we had it. Here we just show a message.
            const msg = document.getElementById('vaultMessage');
            if (msg) msg.innerHTML = '🟢 VAULT UNLOCKED';
        }
        window.unlockVault = unlockVault;

        // ─── Patch the verify button to call unlockVault on success ────
        // We'll override the verify click handler to also call unlockVault.
        // Actually we already have it in the verify logic; we can call unlockVault there.
        // But we need to modify the existing listener. We'll keep the current listener and add a call.
        // Since we have the puzzleSolved flag, we can check for that.

        // ─── Init ─────────────────────────────────────────────────────────
        setBodyHeight();
        renderImages();

        // Also, we need to make the green image initially hidden (or not clickable) until screws drop.
        // It already has pointer-events: auto, but we can set it to none initially.
        const greenImg = document.getElementById('green-img');
        if (greenImg) greenImg.style.pointerEvents = 'none';

        // After screws drop, we enable it in checkAllScrewsDropped.
        // Also we need to enable bluegreen similarly, but we'll handle it there.

        // ─── Re‑run the puzzle check if it was already solved? ──────────
        // Not needed.

        console.log('Binary puzzle integrated. Green.png will auto‑solve when clicked after screws/hole are gone.');
    </script>
</body>
</html>
