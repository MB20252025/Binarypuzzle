<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Puzzle – Detective Logic</title>
    <style>
        /* ===== Global reset & background ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            min-height: 100vh;
            overflow-y: auto;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            background-image: url('bcodeface.png');
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-position: top left;
            background-color: #1a1a2e;
        }
        #overlay {
            position: relative;
            width: 100%;
            min-height: inherit;
            pointer-events: none;   /* allow clicks on interactive children */
        }

        /* ===== Base image style ===== */
        .extra-image {
            position: absolute;
            object-fit: contain;
            pointer-events: none;
        }

        /* ===== Layer z‑indexes (integer order) ===== */
        .layer-other    { z-index: 1; }
        .layer-solution { z-index: 2; }
        .layer-above    { z-index: 3; }
        .cover          { z-index: 4; transition: top 0.8s ease, opacity 0.8s; }
        .cover.dropped  { top: 110% !important; opacity: 0; }
        .screw          { z-index: 5; pointer-events: auto; cursor: pointer; transition: transform 0.3s ease, opacity 0.5s, top 0.5s; }
        .screw.dropped  { pointer-events: none; opacity: 0; top: 110% !important; }

        /* ===== Numbers (clickable grid tiles) ===== */
        .number-item {
            position: absolute;
            pointer-events: auto;
            z-index: 6;             /* above images, below UI */
            font-weight: 700;
            text-align: center;
            transform: translate(-50%, -50%);
            line-height: 1;
            transition: color 0.15s;
            background: transparent;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(0, 0, 0, 0.95), 0 2px 10px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            width: 80px;
            height: 80px;
        }
        .number-item.locked {
            cursor: not-allowed;
            opacity: 0.7;
            color: #aac0d0;
        }
        .number-item.state-1 {
            color: #ffd93d;
            text-shadow: 0 0 40px rgba(255, 217, 61, 0.5), 0 0 20px rgba(0, 0, 0, 0.9);
        }

        /* ===== Puzzle UI (Verify button & message) ===== */
        .puzzle-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 15px 25px;
            border-radius: 30px;
            border: 1px solid #2a3a5e;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .action-button {
            background: #2a3948;
            border: none;
            color: #e5efff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 10px 30px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #10171f, 0 3px 12px black;
            transition: 0.07s linear;
            border: 1px solid #4d6479;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .action-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #10171f;
        }
        .action-button:disabled {
            opacity: 0.6;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #10171f;
            cursor: not-allowed;
        }
        .message-area {
            min-height: 40px;
            font-size: 1.4rem;
            font-weight: 500;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .granted { color: #87f5b2; text-shadow: 0 0 10px #00cc66; animation: unlockPulse 0.8s; }
        .denied { color: #ff8a8a; text-shadow: 0 0 10px #cc3333; }
        .analyzing-text { color: #f5e56b; text-shadow: 0 0 6px #ffd966; }
        @keyframes unlockPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); text-shadow: 0 0 25px #33ee88; }
        }
        .led-strip {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .led {
            width: 10px;
            height: 10px;
            background: #2b3a44;
            border-radius: 50%;
            box-shadow: inset 0 0 4px black;
        }
        .led.active { background: #44dd88; box-shadow: 0 0 12px #22ee88; }

        @media (max-width: 600px) {
            .number-item { width: 60px; height: 60px; font-size: 36px; }
            .puzzle-ui { padding: 12px 18px; bottom: 10px; }
            .action-button { font-size: 0.9rem; padding: 8px 20px; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <!-- Numbers and images will be injected here by JS -->
        <!-- Puzzle UI will be appended here -->
    </div>

    <script>
        // ================================================================
        //  1. OLD PUZZLE LOGIC (detective binary)
        // ================================================================

        const SIZE = 6;
        const EMPTY = -1;
        const CIRCLE = 0;   // represents '0'
        const TRIANGLE = 1; // represents '1'

        // ---- Clue and Solution patterns from the original game ----
        const cluePattern = [
            "0.....",
            "......",
            "1.....",
            ".0..0.",
            "1..0..",
            ".0...0"
        ];
        const solutionPattern = [
            "001011",
            "010011",
            "110100",
            "001101",
            "110010",
            "101100"
        ];

        function patternToGrid(pattern) {
            const grid = Array(SIZE).fill().map(() => Array(SIZE).fill(EMPTY));
            for (let r = 0; r < SIZE; r++) {
                const rowStr = pattern[r];
                for (let c = 0; c < SIZE; c++) {
                    const ch = rowStr[c];
                    if (ch === '0') grid[r][c] = CIRCLE;
                    else if (ch === '1') grid[r][c] = TRIANGLE;
                }
            }
            return grid;
        }

        const clueGrid = patternToGrid(cluePattern);
        const solutionGrid = patternToGrid(solutionPattern);
        const lockedGrid = Array(SIZE).fill().map((_, r) =>
            Array(SIZE).fill().map((_, c) => clueGrid[r][c] !== EMPTY)
        );

        // ---- Current state (starts as a copy of clueGrid) ----
        let currentGrid = clueGrid.map(row => [...row]);
        let puzzleSolved = false;

        // ---- DOM refs for UI elements ----
        const overlay = document.getElementById('overlay');

        // ---- Build the puzzle UI (verify button, message, LEDs) ----
        const puzzleUI = document.createElement('div');
        puzzleUI.className = 'puzzle-ui';
        puzzleUI.innerHTML = `
            <div class="message-area" id="puzzleMessage"></div>
            <button class="action-button" id="verifyBtn">🔒 VERIFY</button>
            <div class="led-strip">
                <span class="led"></span><span class="led"></span><span class="led"></span><span class="led"></span>
            </div>
        `;
        overlay.appendChild(puzzleUI);

        const messageDiv = document.getElementById('puzzleMessage');
        const verifyBtn = document.getElementById('verifyBtn');
        const leds = puzzleUI.querySelectorAll('.led');

        // ---- Render the numbers over the image (our new visual grid) ----
        // We'll re-use the POSITIONS array from the user's last configuration.
        const POSITIONS = [
            { x: 18, y: 25 },  { x: 31, y: 25 },  { x: 44, y: 25 },  { x: 57, y: 25 },  { x: 70, y: 25 },  { x: 83, y: 25 },
            { x: 18, y: 32 },  { x: 31, y: 32 },  { x: 44, y: 32 },  { x: 57, y: 32 },  { x: 70, y: 32 },  { x: 83, y: 32 },
            { x: 18, y: 38.5 },{ x: 31, y: 38.5 },{ x: 44, y: 38.5 },{ x: 57, y: 38.5 },{ x: 70, y: 38.5 },{ x: 83, y: 38.5 },
            { x: 18, y: 45.5 },{ x: 31, y: 45.5 },{ x: 44, y: 45.5 },{ x: 57, y: 45.5 },{ x: 70, y: 45.5 },{ x: 83, y: 45.5 },
            { x: 18, y: 52 },  { x: 31, y: 52 },  { x: 44, y: 52 },  { x: 57, y: 52 },  { x: 70, y: 52 },  { x: 83, y: 52 },
            { x: 18, y: 58.5 },{ x: 31, y: 58.5 },{ x: 44, y: 58.5 },{ x: 57, y: 58.5 },{ x: 70, y: 58.5 },{ x: 83, y: 58.5 }
        ];

        const SCALE = 1.0;  // number size multiplier

        // Store references to number elements for updates
        const numberElements = [];

        function renderNumbers() {
            const baseSize = 48;
            const scaledSize = baseSize * SCALE;
            // Remove any existing number items (if re‑rendering)
            document.querySelectorAll('.number-item').forEach(el => el.remove());

            POSITIONS.forEach((pos, index) => {
                const r = Math.floor(index / SIZE);
                const c = index % SIZE;
                const val = currentGrid[r][c];
                const isLocked = lockedGrid[r][c];

                const el = document.createElement('div');
                el.className = 'number-item';
                if (isLocked) el.classList.add('locked');
                // Display text: empty => '', 0 => '0', 1 => '1'
                el.textContent = (val === EMPTY) ? '' : (val === CIRCLE ? '0' : '1');
                if (val === TRIANGLE) el.classList.add('state-1');

                el.style.fontSize = scaledSize + 'px';
                el.style.width = (scaledSize * 1.6) + 'px';
                el.style.height = (scaledSize * 1.6) + 'px';
                el.style.left = pos.x + '%';
                el.style.top = pos.y + '%';

                // Store grid coordinates for click handler
                el.dataset.row = r;
                el.dataset.col = c;

                // Click handler for toggling
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const row = parseInt(this.dataset.row);
                    const col = parseInt(this.dataset.col);
                    // Ignore if locked or already solved
                    if (lockedGrid[row][col] || puzzleSolved) return;
                    // Cycle: EMPTY -> 0 -> 1 -> EMPTY
                    let newVal = currentGrid[row][col];
                    if (newVal === EMPTY) newVal = CIRCLE;
                    else if (newVal === CIRCLE) newVal = TRIANGLE;
                    else if (newVal === TRIANGLE) newVal = EMPTY;
                    currentGrid[row][col] = newVal;
                    // Update display
                    this.textContent = (newVal === EMPTY) ? '' : (newVal === CIRCLE ? '0' : '1');
                    this.classList.toggle('state-1', newVal === TRIANGLE);
                });

                overlay.appendChild(el);
                numberElements.push(el);
            });
        }

        // ---- Verify logic ----
        function checkSolution() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (currentGrid[r][c] !== solutionGrid[r][c]) return false;
                }
            }
            return true;
        }

        function grantAccess() {
            puzzleSolved = true;
            messageDiv.innerHTML = '<span class="granted">🔓 ACCESS GRANTED</span>';
            leds.forEach((led, i) => setTimeout(() => led.classList.add('active'), i * 100));
            // Unlock the vault (call the external function if defined)
            if (window.unlockVault) window.unlockVault();
        }

        function denyAccess() {
            messageDiv.innerHTML = '<span class="denied">⛔ ACCESS DENIED</span>';
        }

        verifyBtn.addEventListener('click', function() {
            if (this.disabled) return;
            this.disabled = true;
            messageDiv.innerHTML = '<span class="analyzing-text">🔍 ANALYZING…</span>';
            // Simulate a brief scan
            setTimeout(() => {
                const correct = checkSolution();
                if (correct) {
                    grantAccess();
                } else {
                    denyAccess();
                }
                this.disabled = false;
            }, 800);
        });

        // ---- Auto‑solve (triggered by green.png) ----
        function autoSolvePuzzle() {
            if (puzzleSolved) return;
            // Fill currentGrid with solution
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    currentGrid[r][c] = solutionGrid[r][c];
                }
            }
            // Re‑render numbers to reflect changes
            renderNumbers();
            // Immediately grant access (or you could auto‑click verify)
            grantAccess();
        }
        window.autoSolvePuzzle = autoSolvePuzzle;

        // ---- Initial render ----
        renderNumbers();

        // ================================================================
        //  2. SCREWS, HOLE, AND IMAGE LAYERS (from previous version)
        // ================================================================

        // ---- Image configurations (user's exact positions) ----
        const LAYERS = [
            { src: 'greencut.png',    x: 40, y: 85, width: 25, height: 'auto', cls: 'layer-other' },
            { src: 'redbluecut.png',  x: 40, y: 85, width: 25, height: 'auto', cls: 'layer-other' },
            { src: 'solutionbox.png', x: 40, y: 85, width: 25, height: 'auto', cls: 'layer-solution' },
            // These two become clickable after screws drop
            { src: 'bluegreen.png',   x: 42.3, y: 87, width: 20.3, height: 'auto', cls: 'layer-above' },
            { src: 'green.png',       x: 42, y: 91.5, width: 20.9, height: 'auto', cls: 'layer-above' },
        ];

        const COVER = { src: 'hole.png', x: 1, y: 85, width: 25, height: 'auto', cls: 'cover' };
        const SCREWS = [
            { src: 'screw1.png', x: 1, y: 86, width: 7.3, height: 'auto' },
            { src: 'screw2.png', x: 1, y: 86, width: 7.3, height: 'auto' },
            { src: 'screw3.png', x: 1, y: 91, width: 7.3, height: 'auto' },
            { src: 'screw4.png', x: 1, y: 91, width: 7.3, height: 'auto' },
        ];

        // ---- Render images ----
        function renderImages() {
            LAYERS.forEach((data) => {
                const img = document.createElement('img');
                img.src = data.src;
                img.className = `extra-image ${data.cls || ''}`;
                img.style.left = data.x + '%';
                img.style.top = data.y + '%';
                img.style.width = (data.width !== 'auto' ? data.width + '%' : 'auto');
                img.style.height = (data.height !== 'auto' ? data.height + '%' : 'auto');
                overlay.appendChild(img);
                // Special handling for green.png
                if (data.src === 'green.png') {
                    img.id = 'green-img';
                    img.style.pointerEvents = 'none';  // initially disabled
                    img.style.cursor = 'default';
                    // Click handler will be set later when enabled
                }
                if (data.src === 'bluegreen.png') {
                    img.id = 'bluegreen-img';
                }
            });

            // Cover
            const coverImg = document.createElement('img');
            coverImg.src = COVER.src;
            coverImg.className = `extra-image ${COVER.cls || ''}`;
            coverImg.style.left = COVER.x + '%';
            coverImg.style.top = COVER.y + '%';
            coverImg.style.width = (COVER.width !== 'auto' ? COVER.width + '%' : 'auto');
            coverImg.style.height = (COVER.height !== 'auto' ? COVER.height + '%' : 'auto');
            coverImg.id = 'cover-image';
            overlay.appendChild(coverImg);

            // Screws
            const screwElements = [];
            SCREWS.forEach((data, index) => {
                const img = document.createElement('img');
                img.src = data.src;
                img.className = 'extra-image screw';
                img.style.left = data.x + '%';
                img.style.top = data.y + '%';
                img.style.width = (data.width !== 'auto' ? data.width + '%' : 'auto');
                img.style.height = (data.height !== 'auto' ? data.height + '%' : 'auto');
                img.dataset.index = index;
                img.addEventListener('click', function(e) {
                    e.stopPropagation();
                    handleScrewClick(index);
                });
                overlay.appendChild(img);
                screwElements.push(img);
            });

            // Store references for screw logic
            window.screwElements = screwElements;
            window.coverElement = coverImg;
            window.screwClicks = [0, 0, 0, 0];
        }

        // ---- Screw click logic ----
        function handleScrewClick(index) {
            const clicks = window.screwClicks;
            if (clicks[index] >= 4) return;
            clicks[index]++;
            const element = window.screwElements[index];
            const rotation = clicks[index] * 90;
            element.style.transform = `rotate(${rotation}deg)`;
            if (clicks[index] >= 4) {
                element.classList.add('dropped');
                checkAllScrewsDropped();
            }
        }

        function checkAllScrewsDropped() {
            const allDropped = window.screwClicks.every(c => c >= 4);
            if (allDropped && window.coverElement) {
                window.coverElement.classList.add('dropped');
                // Enable green.png click to auto‑solve
                const greenImg = document.getElementById('green-img');
                if (greenImg) {
                    greenImg.style.pointerEvents = 'auto';
                    greenImg.style.cursor = 'pointer';
                    greenImg.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (window.autoSolvePuzzle) window.autoSolvePuzzle();
                    });
                }
                // Enable bluegreen.png to reveal redbluecut (optional)
                const bluegreenImg = document.getElementById('bluegreen-img');
                if (bluegreenImg) {
                    bluegreenImg.style.pointerEvents = 'auto';
                    bluegreenImg.style.cursor = 'pointer';
                    bluegreenImg.addEventListener('click', function() {
                        const redbluecut = document.querySelector('img[src="redbluecut.png"]');
                        if (redbluecut) redbluecut.style.zIndex = 11;
                    });
                }
            }
        }

        // ---- Set body height to match background ----
        function setBodyHeight() {
            const img = new Image();
            img.onload = function() {
                const aspect = img.width / img.height;
                const heightPx = window.innerWidth / aspect;
                document.body.style.minHeight = heightPx + 'px';
                overlay.style.minHeight = heightPx + 'px';
            };
            img.src = 'bcodeface.png';
        }

        // ---- Vault unlock (called when puzzle solved) ----
        function unlockVault() {
            console.log('VAULT UNLOCKED!');
            // You can add extra effects here (e.g., change a global state)
            // In a full integration, this could trigger the vault door animation.
        }
        window.unlockVault = unlockVault;

        // ---- Init ----
        setBodyHeight();
        renderImages();

        // Ensure green is initially disabled (it's already pointer-events:none from render)
        // The enable happens after screws drop.
        console.log('Binary puzzle with detective logic ready.');
    </script>
</body>
</html>
