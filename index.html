<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6×6 Binary Puzzle – with second image</title>
    <style>
        /* ── Full‑screen background ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-image: url('bcodeface.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        /* ── Container for both overlay image and numbers ── */
        #overlay {
            position: relative;
            width: 100vw;
            height: 100vh;
            pointer-events: none;   /* allow clicks to pass to numbers */
        }

        /* ── The second image (solutionbox.png) ── */
        #solution-image {
            position: absolute;
            pointer-events: none;   /* don't block clicks on numbers */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            /* Position and size set by JS */
        }

        /* ── Numbers ── */
        .number-item {
            position: absolute;
            pointer-events: auto;   /* clickable */
            font-weight: 700;
            text-align: center;
            transform: translate(-50%, -50%);
            line-height: 1;
            transition: color 0.15s;
            background: transparent;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(0, 0, 0, 0.95), 0 2px 10px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            width: 80px;
            height: 80px;
        }

        .number-item.state-1 {
            color: #ffd93d;
            text-shadow: 0 0 40px rgba(255, 217, 61, 0.5), 0 0 20px rgba(0, 0, 0, 0.9);
        }

        /* ── Controls ── */
        #controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(6px);
            padding: 12px 28px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #2a3a5e;
            pointer-events: auto;
        }

        #controls button {
            background: #e94560;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 0 #a12a3f;
        }
        #controls button:hover {
            background: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #a12a3f;
        }
        #controls button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a12a3f;
        }

        #controls span {
            color: #b0c4de;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            #controls {
                padding: 10px 16px;
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
                bottom: 16px;
                border-radius: 30px;
            }
            #controls button {
                font-size: 0.8rem;
                padding: 6px 16px;
            }
            .number-item {
                width: 60px;
                height: 60px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <!-- The second image will be injected here -->
        <div id="solution-image"></div>
        <!-- Numbers will be injected here -->
    </div>

    <div id="controls">
        <button id="resetBtn">⟳ Reset All</button>
        <span>Click a number to toggle 0 / 1</span>
    </div>

    <script>
        // ================================================================
        //  CONFIGURATION – EDIT THESE VALUES TO CUSTOMIZE THE PUZZLE
        // ================================================================

        // 1. Overall scale of ALL numbers
        const SCALE = 1.0;   // 1.0 = default size

        // 2. Positions for the 36 numbers (6 columns × 6 rows)
        //    x = % from left, y = % from top
        const POSITIONS = [
            // Row 1
            { x: 12, y: 12 },  // Tile  0
            { x: 25, y: 12 },  // Tile  1
            { x: 38, y: 12 },  // Tile  2
            { x: 51, y: 12 },  // Tile  3
            { x: 64, y: 12 },  // Tile  4
            { x: 77, y: 12 },  // Tile  5
            // Row 2
            { x: 12, y: 26 },  // Tile  6
            { x: 25, y: 26 },  // Tile  7
            { x: 38, y: 26 },  // Tile  8
            { x: 51, y: 26 },  // Tile  9
            { x: 64, y: 26 },  // Tile 10
            { x: 77, y: 26 },  // Tile 11
            // Row 3
            { x: 12, y: 40 },  // Tile 12
            { x: 25, y: 40 },  // Tile 13
            { x: 38, y: 40 },  // Tile 14
            { x: 51, y: 40 },  // Tile 15
            { x: 64, y: 40 },  // Tile 16
            { x: 77, y: 40 },  // Tile 17
            // Row 4
            { x: 12, y: 54 },  // Tile 18
            { x: 25, y: 54 },  // Tile 19
            { x: 38, y: 54 },  // Tile 20
            { x: 51, y: 54 },  // Tile 21
            { x: 64, y: 54 },  // Tile 22
            { x: 77, y: 54 },  // Tile 23
            // Row 5
            { x: 12, y: 68 },  // Tile 24
            { x: 25, y: 68 },  // Tile 25
            { x: 38, y: 68 },  // Tile 26
            { x: 51, y: 68 },  // Tile 27
            { x: 64, y: 68 },  // Tile 28
            { x: 77, y: 68 },  // Tile 29
            // Row 6
            { x: 12, y: 82 },  // Tile 30
            { x: 25, y: 82 },  // Tile 31
            { x: 38, y: 82 },  // Tile 32
            { x: 51, y: 82 },  // Tile 33
            { x: 64, y: 82 },  // Tile 34
            { x: 77, y: 82 }   // Tile 35
        ];

        // 3. SECOND IMAGE (solutionbox.png)
        const SOLUTION_IMAGE = {
            url: 'solutionbox.png',   // file name
            x: 50,                    // % from left edge
            y: 80,                    // % from top edge
            width: 30,                // % of viewport width (or 'auto' to keep aspect ratio)
            height: 'auto'            // % of viewport height, or 'auto'
        };

        // ================================================================
        //  END OF CONFIGURATION – DO NOT EDIT BELOW THIS LINE
        // ================================================================

        const container = document.getElementById('overlay');
        const solutionEl = document.getElementById('solution-image');
        const total = POSITIONS.length;
        const state = new Array(total).fill(0);

        // ─── Render second image ─────────────────────────────────────────
        function renderSolutionImage() {
            const img = SOLUTION_IMAGE;
            solutionEl.style.backgroundImage = `url('${img.url}')`;
            solutionEl.style.left = img.x + '%';
            solutionEl.style.top = img.y + '%';

            // Handle width and height
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            let w = img.width;
            let h = img.height;

            if (w === 'auto' && h === 'auto') {
                // if both auto, set a default size (e.g., 20% width)
                w = 20;
                h = 'auto';
            }

            if (w !== 'auto') {
                solutionEl.style.width = (typeof w === 'number' ? w : parseFloat(w)) + '%';
            } else {
                // if width auto, we need to set height first then width auto? We'll compute later if both auto
                // But we can just let background-size: contain handle it if we set only one dimension
                // Simplest: set background-size: contain and set both width and height to auto? Better: set only one dimension.
                // We'll set width to auto if not specified.
                solutionEl.style.width = 'auto';
            }

            if (h !== 'auto') {
                solutionEl.style.height = (typeof h === 'number' ? h : parseFloat(h)) + '%';
            } else {
                solutionEl.style.height = 'auto';
            }

            // If both are 'auto', we need to set a default size. But we can handle that by setting background-size: contain and size 100%?
            // Actually we can set both width and height to auto and use background-size: contain on the element? That won't work because the element itself has no intrinsic size.
            // Better: if width is auto, we set width to 20% and height auto, or we force a size.
            // Let's simplify: if width is 'auto', we set it to 20% as fallback.
            if (img.width === 'auto' && img.height === 'auto') {
                solutionEl.style.width = '20%';
                solutionEl.style.height = 'auto';
            }

            // Ensure background image fills the element properly
            solutionEl.style.backgroundSize = 'contain';
            solutionEl.style.backgroundPosition = 'center';
            solutionEl.style.backgroundRepeat = 'no-repeat';
        }

        // ─── Render numbers ──────────────────────────────────────────────
        function renderNumbers() {
            const baseSize = 48;
            const scaledSize = baseSize * SCALE;

            POSITIONS.forEach((pos, index) => {
                const el = document.createElement('div');
                el.className = `number-item state-${state[index]}`;
                el.textContent = state[index];
                el.style.fontSize = scaledSize + 'px';
                el.style.width = (scaledSize * 1.6) + 'px';
                el.style.height = (scaledSize * 1.6) + 'px';
                el.style.left = pos.x + '%';
                el.style.top = pos.y + '%';

                el.addEventListener('click', function(e) {
                    state[index] = state[index] === 0 ? 1 : 0;
                    this.textContent = state[index];
                    this.className = `number-item state-${state[index]}`;
                });

                container.appendChild(el);
            });
        }

        // ─── Reset values ─────────────────────────────────────────────────
        function resetValues() {
            for (let i = 0; i < state.length; i++) {
                state[i] = 0;
            }
            const items = container.querySelectorAll('.number-item');
            items.forEach((el, idx) => {
                el.textContent = '0';
                el.className = 'number-item state-0';
            });
        }

        // ─── Init ─────────────────────────────────────────────────────────
        renderSolutionImage();
        renderNumbers();

        document.getElementById('resetBtn').addEventListener('click', resetValues);

        window.addEventListener('keydown', function(e) {
            if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) {
                resetValues();
                e.preventDefault();
            }
        });

        // On resize, update the solution image dimensions if they are in % (no need, because % are relative to viewport)
        // But we might need to recalc if we used viewport units. Not necessary.
    </script>
</body>
</html>
